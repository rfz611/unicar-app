<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Escolher percurso — UniCar</title><style>
*{box-sizing:border-box}body{margin:0;font:16px -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif;background:white;color:#052355;padding:16px}h1{font-size:22px;margin:0 0 16px}label{display:block;font-size:14px;font-weight:600;margin:12px 0 6px}input,button{font:inherit}input{width:100%;padding:12px;border:1px solid #dce3ef;border-radius:6px;color:#052355}button{min-height:46px;padding:10px 14px;border:0;border-radius:6px;background:#e8edf5;color:#052355}button.primary{background:#052355;color:white;width:100%;margin-top:12px}button:disabled{opacity:.5}.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}#map{height:330px;border-radius:8px;background:#f1f4f9;margin:12px 0}#state{line-height:1.5;font-size:14px;white-space:pre-wrap}gmp-place-autocomplete{width:100%;color-scheme:light}small{color:#5b6b85}.active{background:#052355;color:white}
.place-only #map,.place-only .row,.place-only #calculate,.place-only #origin-search,.place-only input,.place-only label,.place-only p{display:none}
</style></head><body><h1>Escolha o percurso</h1><div id="state" role="status">Carregando mapa…</div>
<label>Pesquisar saída</label><div id="origin-search"></div><label>Pesquisar destino</label><div id="destination-search"></div>
<div class="row"><button id="pick-origin" class="active">Marcar saída no mapa</button><button id="pick-destination">Marcar destino no mapa</button><button id="location">Usar minha localização</button></div>
<div id="map" aria-label="Mapa de seleção de origem e destino"></div>
<label for="origin-label">Ponto de encontro da saída</label><input id="origin-label" maxlength="150" placeholder="Selecione a saída no mapa">
<label for="destination-label">Ponto de encontro do destino</label><input id="destination-label" maxlength="150" placeholder="Selecione o destino no mapa">
<button class="primary" id="calculate" disabled>Calcular percurso</button><p><small>Confirme os pontos e depois toque em Usar percurso no aplicativo.</small></p><script src="map.js"></script></body></html>
